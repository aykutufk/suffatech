apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: suffatech-microservices
  namespace: argocd
  labels:
    app.kubernetes.io/name: suffatech-microservices
    app.kubernetes.io/part-of: suffatech

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - service: bot-server
            valuesFile: bot-server-values.yaml

          - service: schema-server
            valuesFile: schema-server-values.yaml

          - service: values-server
            valuesFile: values-server-values.yaml

  template:
    metadata:
      name: 'suffatech-{{ .service }}'
      labels:
        app.kubernetes.io/part-of: suffatech
        app.kubernetes.io/component: microservice
        suffatech.io/service: '{{ .service }}'

    spec:
      project: default

      source:
        repoURL: https://github.com/aykutufk/suffatech.git
        targetRevision: main
        path: charts/microservice

        helm:
          valueFiles:
            - '../../deploy/{{ .valuesFile }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: suffatech

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
          - PruneLast=true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

  syncPolicy:
    preserveResourcesOnDeletion: false
