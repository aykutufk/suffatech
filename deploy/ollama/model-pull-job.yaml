apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
  namespace: suffatech
  labels:
    app.kubernetes.io/name: ollama-model-pull
    app.kubernetes.io/part-of: suffatech
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-model-pull
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: model-pull
          image: ollama/ollama:0.32.5
          imagePullPolicy: IfNotPresent

          # Resmi imajın ENTRYPOINT'i /bin/ollama olduğu için
          # bu args, "ollama pull qwen2.5:3b" çalıştırır.
          args:
            - pull
            - qwen2.5:3b

          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
