apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: suffatech
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: suffatech
spec:
  replicas: 1
  revisionHistoryLimit: 2

  # Local-path/RWO disk kullandığımız için önce eski podu kapatır.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: ollama

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: suffatech
    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ollama
          image: ollama/ollama:0.32.5
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"

          ports:
            - name: http
              containerPort: 11434
              protocol: TCP

          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3500Mi

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
