apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.schemaConfigMapName }}
  labels:
    app.kubernetes.io/name: schema-server
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: suffatech
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{ (.Files.Glob "schemas/*.schema.json").AsConfig | indent 2 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.valuesConfigMapName }}
  labels:
    app.kubernetes.io/name: values-server
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: suffatech
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{ (.Files.Glob "values/*.value.json").AsConfig | indent 2 }}